<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우주 오프닝 재생 테스트</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101522;color:#eef3ff;font:17px/1.7 system-ui,sans-serif}main{width:min(620px,90vw)}h1{line-height:1.25}button{font:inherit;padding:16px 26px;border:0;border-radius:12px;background:#bfdbfe;color:#101522;cursor:pointer}button:disabled{opacity:.6}pre{white-space:pre-wrap;color:#bdd6f7;font-size:14px}p{color:#b4c2d8}</style></head>
<body><main><h1>우주에서 인천까지</h1><p>버튼을 누르면 14초 비행이 시작됩니다. 끝나면 이 화면으로 돌아옵니다.</p>
<button id="play">우주 오프닝 재생</button><pre id="result" role="status">재생 준비가 되었습니다.</pre></main>
<script src="https://arthong1.github.io/aihancut-intro/intro.js?v=1.1.0"></script>
<script>
const button=document.getElementById('play'),output=document.getElementById('result');
button.addEventListener('click',async()=>{
  button.disabled=true;const began=performance.now();output.textContent='오프닝을 불러오고 있습니다…';
  try{
    if(!window.AIHancutIntro)throw new Error('스크립트를 불러오지 못했습니다.');
    const result=await AIHancutIntro.play({motion:'full',sound:true,timeoutMs:60000});
    output.textContent=`소요 시간: ${((performance.now()-began)/1000).toFixed(1)}초\nSDK: ${AIHancutIntro.version}\n${JSON.stringify(result,null,2)}`;
  }catch(error){output.textContent='오류: '+error.message;}finally{button.disabled=false;}
});
</script></body></html>
