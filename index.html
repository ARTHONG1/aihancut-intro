<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI한컷 오프닝 연결 예제</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080c16;color:#eef3ff;font:16px/1.7 system-ui,sans-serif}main{max-width:780px;margin:0 auto;padding:72px 24px}h1{font-size:clamp(30px,6vw,46px);line-height:1.2;letter-spacing:-.04em}p{color:#b4c2d8}button{font:inherit;padding:13px 23px;border:1px solid #a5d1ff;border-radius:12px;color:#07111f;background:#c0ddff;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:5px}button:disabled{opacity:.6}pre{margin:30px 0 0;padding:22px;background:#111b2d;border:1px solid #263b58;border-radius:14px;overflow:auto;font-size:14px;line-height:1.8}#status{min-height:54px;margin:24px 0}a{color:#bedcff}
</style></head><body><main>
<h1>우주에서, 내 웹앱으로.</h1>
<p>버튼을 누르면 오프닝이 전체 화면으로 재생됩니다. 인천에 도착하면 자동으로 닫히고 이 화면으로 돌아옵니다.</p>
<button id="play" type="button">오프닝 실행</button>
<p id="status" role="status">앱의 기존 화면을 그대로 두고 오프닝을 띄웁니다. Esc 키로 닫을 수 있습니다.</p>
<pre><code id="snippet"></code></pre>
<p>아래 코드의 스크립트 주소는 이 예제에 접속한 주소를 따릅니다. 운영 웹앱에는 공개 배포한 HTTPS 주소를 사용하세요.</p>
<p>사진·텍스처 출처: <a href="assets/SOURCES.md">지구</a> · <a href="assets/MOON-SOURCES.md">달</a> · <a href="assets/NIGHT-SOURCES.md">인천</a></p>
</main><script src="./intro.js"></script><script>
const button=document.getElementById('play'),status=document.getElementById('status');
const scriptURL=new URL('./intro.js',window.location.href).href;
document.getElementById('snippet').textContent='<script src="'+scriptURL+'"><\/script>\n<script>\n  AIHancutIntro.play({\n    onComplete: () => {\n      // 오프닝이 닫힌 뒤 실행할 코드\n    }\n  });\n<\/script>';
button.addEventListener('click',async()=>{
  button.disabled=true;status.textContent='오프닝을 준비하고 있습니다.';
  const result=await AIHancutIntro.play({sound:true,
    onComplete:()=>{status.textContent='인천에 도착했습니다. 오프닝이 닫히고 기존 화면으로 돌아왔습니다.';},
    onError:()=>{status.textContent='오프닝을 재생하지 못해 기존 화면으로 돌아왔습니다. 다시 시도할 수 있습니다.';}
  });
  if(result.status==='cancelled')status.textContent='오프닝을 닫았습니다.';
  button.disabled=false;
});
</script></body></html>
